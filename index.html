<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Telldouble | Second World OS Hub</title>
    <style>
        :root {
            --bg-color: #0d0d0d;
            --card-bg: #161616;
            --card-border: #262626;
            --text-main: #ffffff;
            --text-muted: #a1a1a1;
            --gold-accent: #c5a059;
            --gold-gradient: linear-gradient(135deg, #d4af37 0%, #c5a059 50%, #9a7b38 100%);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            padding: 20px 10px;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 480px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        /* Profile Card Header */
        .profile-card {
            background-color: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 20px;
            overflow: hidden;
            text-align: center;
            padding: 24px 16px;
        }

        .profile-card h1 {
            font-size: 1.4rem;
            font-weight: 700;
            margin-bottom: 4px;
        }

        .profile-card p {
            font-size: 0.85rem;
            color: var(--text-muted);
            line-height: 1.3;
        }

        /* Social Pill Link Buttons */
        .social-pill {
            background-color: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 30px;
            padding: 14px 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-main);
            text-decoration: none;
            font-weight: 600;
            font-size: 0.95rem;
            transition: all 0.2s ease;
        }

        .social-pill:hover {
            background-color: #222222;
            border-color: var(--gold-accent);
        }

        /* Card Section Component */
        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 20px;
            padding: 20px;
        }

        .card-title {
            font-size: 0.85rem;
            font-weight: 700;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            text-align: center;
            margin-bottom: 16px;
            color: var(--gold-accent);
        }

        /* Stylized Support / Tip Section */
        .tip-card {
            background: linear-gradient(180deg, #1f1a10 0%, #161616 100%);
            border: 1px solid #4a3b1a;
        }

        .tip-grid {
            display: flex;
            gap: 10px;
        }

        .tip-btn {
            flex: 1;
            background: var(--gold-gradient);
            color: #000000;
            font-weight: 800;
            padding: 14px 8px;
            border-radius: 12px;
            text-decoration: none;
            text-align: center;
            font-size: 0.9rem;
            border: none;
            box-shadow: 0 4px 12px rgba(197, 160, 89, 0.2);
            transition: transform 0.15s ease, box-shadow 0.15s ease;
        }
