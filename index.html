<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Telldouble | Second World OS Hub</title>
    <style>
        :root {
            --bg-dark: #000000;
            --card-bg: #121212;
            --card-border: #222222;
            --text-primary: #ffffff;
            --text-secondary: #999999;
            --accent-color: #ffffff;
            --gold-accent: #c5a059;
            --gold-gradient: linear-gradient(135deg, #f3e5ab 0%, #c5a059 50%, #9a7b38 100%);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            position: relative;
            overflow-x: hidden;
        }

        /* Fullscreen Blurred Backdrop */
        .page-backdrop {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: radial-gradient(circle at center, rgba(30, 30, 35, 0.6) 0%, rgba(0, 0, 0, 0.95) 100%);
            backdrop-filter: blur(40px);
            -webkit-backdrop-filter: blur(40px);
            z-index: 0;
        }

        /* Central Mobile Container */
        .hub-container {
            width: 100%;
            max-width: 440px;
            background-color: #0d0d0f;
            min-height: 100vh;
            position: relative;
            z-index: 1;
            padding: 24px 16px 40px 16px;
            display: flex;
            flex-direction: column;
            gap: 20px;

            border-left: 1px solid rgba(255, 255, 255, 0.05);
            border-right: 1px solid rgba(255, 255, 255, 0.05);
        }
